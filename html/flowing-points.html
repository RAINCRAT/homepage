<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowing Points</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas {
            display: block;
        }

        .title-overlay {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #fff;
            opacity: 0.25;
            pointer-events: none;
            user-select: none;
        }

        #reloadBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            padding: 10px 20px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.85);
            color: #333;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #reloadBtn:hover {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.3);
        }

        #loadingText {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px 30px;
            border-radius: 25px;
            display: none;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>
    <div class="title-overlay">FLOWING POINTS</div>
    <button id="reloadBtn">↻ 重新加载</button>
    <div id="loadingText">正在解析图片...</div>

    <script src="../js/flowing-points.js"></script>
    <script>
        const loadingText = document.getElementById('loadingText');

        FlowingPoints.init({
            imageSrc: '../images/mainword.png',
            bgColor: '#000000',
            particleColor: '#ffffff',
            particleSize: 3,
            particleMargin: 6,
            repulsionRadius: 105,
            repulsionForce: 1.8,
            friction: 0.15,
            returnSpeed: 0.01,
            samplingStep: 4,
            maxDisplayRatio: 0.9,
            maxImageSize: 3000
        });

        loadingText.style.display = 'none';

        document.getElementById('reloadBtn').addEventListener('click', function () {
            loadingText.style.display = 'block';
            FlowingPoints.reload();
            setTimeout(function () { loadingText.style.display = 'none'; }, 500);
        });
    </script>

</body>

</html>
